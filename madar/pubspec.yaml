name: madar
description: "Madar (مَدار) — a prayer-centered personal life operating system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  sqlite3: ^3.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  flutter_soloud: ^5.1.2
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  animations: ^3.0.0
  meta: ^1.19.0
  flutter_localizations:
    sdk: flutter
  adhan_dart: ^2.0.1
  sensors_plus: ^7.1.0
  flutter_displaymode: ^0.7.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.1
  permission_handler: ^13.0.2
  hijri: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

# Native build-hook configuration.
hooks:
  user_defines:
    sqlite3:
      # SQLCipher on device (encrypted at rest); the host's system SQLite for
      # unit tests on the development machine / CI runner.
      source:
        android: sqlcipher
        default: system
    flutter_soloud:
      # All Madar audio is procedurally synthesised PCM – no Ogg/Opus needed.
      no_xiph_libs: true

flutter:
  uses-material-design: true
  generate: true

  shaders:
    - shaders/glass.frag
    - shaders/cosmos_backdrop.frag
    - shaders/orbit/sky.frag
    - shaders/orbit/moon.frag
    - shaders/orbit/brass.frag
    - shaders/orbit/ring_text.frag
    - shaders/orbit/planet_faith.frag
    - shaders/orbit/planet_ocean.frag
    - shaders/orbit/planet_terracotta.frag
    - shaders/orbit/planet_industrial.frag
    - shaders/orbit/planet_crystal.frag
    - shaders/orbit/planet_verdant.frag
    - shaders/orbit/planet_volcanic.frag
    - shaders/orbit/planet_gas_giant.frag
    - shaders/orbit/data_moon.frag
    - shaders/orbit/core_star.frag
    - shaders/orbit/prayer_fire.frag
    - shaders/orbit/lens_flare.frag
    - shaders/orbit/zoom_blur.frag

  fonts:
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Variable.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/licenses/
    # Native code linked into the app (SQLCipher links OpenSSL on Android):
    # shown on Settings › About › Open-source licences.
    - assets/licenses/
