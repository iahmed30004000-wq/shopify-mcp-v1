name: Madar Android

on:
  push:
    branches: [main, 'claude/madar-**']
    paths:
      - 'madar/**'
      - '.github/workflows/madar-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madar-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: madar
    env:
      HAS_KEYSTORE: ${{ secrets.MADAR_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter environment
        run: |
          flutter --version
          flutter config --no-analytics
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true

      - name: Dependencies
        run: flutter pub get

      - name: Check generated code is up to date
        run: |
          dart run tool/merge_arb.dart
          flutter gen-l10n
          git diff --exit-code -- lib/core/i18n || (echo "::error::Run 'dart run tool/merge_arb.dart && flutter gen-l10n' and commit the result" && exit 1)

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test --exclude-tags screenshot

      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          MADAR_KEYSTORE_BASE64: ${{ secrets.MADAR_KEYSTORE_BASE64 }}
        run: |
          echo "$MADAR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/madar-release.jks"
          echo "MADAR_KEYSTORE_PATH=$RUNNER_TEMP/madar-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MADAR_KEYSTORE_PASSWORD: ${{ secrets.MADAR_KEYSTORE_PASSWORD }}
          MADAR_KEY_ALIAS: ${{ secrets.MADAR_KEY_ALIAS }}
          MADAR_KEY_PASSWORD: ${{ secrets.MADAR_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cd build/app/outputs/flutter-apk
          SIGNING=$([ "$HAS_KEYSTORE" = "true" ] && echo "release-key" || echo "debug-key")
          mv app-release.apk "madar-${{ github.run_number }}-${SIGNING}.apk"
          sha256sum madar-*.apk > SHA256SUMS.txt
          ls -la

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/madar-*.apk | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: madar-apk-${{ github.run_number }}
          path: |
            madar/build/app/outputs/flutter-apk/madar-*.apk
            madar/build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
